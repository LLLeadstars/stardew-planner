<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · 星露谷日程规划（丢弃用 · 验证电脑端规划主流程与编辑交互）</title>
<!--
  丢弃原型 · 不进入正式实现。
  问题：玩家如何从首次进入到排好一天（选活动 / 填参数 / 看估算 / 排序 / 固定时间 / 处理冲突 / 关联目标）？
  形式：三个结构迥异的界面变体，共享同一份内存日程数据，底部浮动条切换。
  运行：直接双击本文件即可，无构建、无依赖、无网络请求。
  持久化：localStorage 键 PROTOTYPE·stardew-planner·day-plan·wipe-me，顶栏「存储」面板可清空。
-->
<style>
:root{
  --bg:#f4f1e8; --panel:#fffdf8; --panel2:#faf7ef; --ink:#2b2a26; --muted:#8b8677;
  --line:#e0dacb; --line2:#cfc7b3;
  --ok:#2f7d4f; --okbg:#e7f4ea; --bad:#a63b2f; --badbg:#fcebe8; --warn:#8a6400; --warnbg:#fdf4d8;
  --accent:#3f6f4a; --accent-bg:#e8f0e9;
  --info:#3a5a8a; --infobg:#e9eef7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100vh}
body.dragging{user-select:none;cursor:grabbing}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:2px 5px}
button.ghost:hover{background:var(--panel2);color:var(--ink)}
button.danger{border-color:#e0b6af;color:var(--bad)}
select,input[type=number],input[type=text],textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line2);border-radius:5px;padding:2px 6px;max-width:100%}
input[type=number]{width:76px}
label{display:block;margin:0 0 7px}
label > span.lb{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.02em}
h3{margin:0 0 8px;font-size:14px}
h4{margin:14px 0 6px;font-size:12.5px;color:var(--muted);text-transform:none;letter-spacing:.04em}
p{margin:0 0 8px}
.hint{color:var(--muted);font-size:11.5px}
.protobadge{display:inline-block;background:#8a2f2f;color:#fff;border-radius:4px;padding:1px 6px;font-size:10.5px;letter-spacing:.08em;vertical-align:middle}
/* ---------- 顶栏 ---------- */
#topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;flex:none}
.tbgroup{display:flex;align-items:center;gap:5px;font-size:12px}
.tbgroup > .k{color:var(--muted);font-size:11px}
.tbsep{width:1px;height:20px;background:var(--line)}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-size:11.5px;background:#fff}
.chip.ok{background:var(--okbg);border-color:#bcdcc4;color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:#e8c3bb;color:var(--bad)}
.chip.warn{background:var(--warnbg);border-color:#e6d69b;color:var(--warn)}
.chip.info{background:var(--infobg);border-color:#c3d0e6;color:var(--info)}
.chip.mute{color:var(--muted)}
/* ---------- 主体 ---------- */
#main{display:flex;flex:1;min-height:0;overflow:hidden}
.col{overflow:auto;padding:10px 12px 46px}
.col.left{border-right:1px solid var(--line);background:var(--panel2)}
.col.right{border-left:1px solid var(--line);background:var(--panel2)}
.grow{flex:1;min-width:0}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.cardhead .t{font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;border-radius:4px;padding:0 5px;font-size:10.5px;border:1px solid var(--line2);background:#fff;color:var(--muted)}
.tag.manual{background:#fdeede;border-color:#e8cba6;color:#8a5a13}
.tag.estimate{background:var(--accent-bg);border-color:#bcd6c1;color:var(--accent)}
.tag.personal{background:#e9e9f7;border-color:#c6c6e4;color:#4a4a8a}
.tag.last{background:#eef3ea;border-color:#cfdcc6;color:#4d6b3f}
.tag.system{background:#f2f0ea;border-color:var(--line2);color:var(--muted)}
.tag.conflict{background:var(--badbg);border-color:#e8c3bb;color:var(--bad)}
.tag.goal{background:var(--infobg);border-color:#c3d0e6;color:var(--info)}
.tag.proto{background:#f0e6f7;border-color:#d5c0e6;color:#6a3f8a}
/* 变体 D：融合 · 按时间定位的单列表 */
.frow{display:flex;gap:8px;align-items:stretch;margin-bottom:4px}
.fgutter{width:56px;flex:none;text-align:right;color:var(--muted);font-size:11px;padding-top:8px;font-variant-numeric:tabular-nums}
.fcardwrap{flex:1;min-width:0;position:relative}
.fmove{position:absolute;right:5px;top:5px;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.frow:hover .fmove,.fcard.sel + .fmove{opacity:1}
.fmove button{padding:0 5px;font-size:11px;line-height:1.5}
.fcard{border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:5px 9px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.fcard:hover{border-color:var(--accent)}
.fcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.fcard.conflict{background:var(--badbg)}
.fcard.spine{border-left:3px solid #d9a79b}
.fcard.nested{background:var(--panel2)}
.fcard.done{opacity:.6}
.ftitle{font-weight:600;margin-bottom:3px}
.fgutter.cont{color:var(--line2);font-size:13px}
.fgap{position:relative;margin:0 0 4px 64px;border-left:2px dotted var(--line2)}
.fgap.adj{border-left-style:dashed}
.fgap.drop-on{background:var(--accent-bg)}
.fcard.drop-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.fcard.drop-before{box-shadow:inset 0 3px 0 0 var(--accent),0 0 0 2px var(--accent-bg)}
.fcard.drop-after{box-shadow:inset 0 -3px 0 0 var(--accent),0 0 0 2px var(--accent-bg)}
.fgap > span{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:10.5px;background:var(--bg);padding:0 5px;white-space:nowrap}
.fov{position:relative;margin:0 0 4px 64px;border-left:2px solid #d9a79b}
.fov > span{position:absolute;left:9px;top:50%;transform:translateY(-50%);background:var(--badbg);color:var(--bad);font-size:10.5px;padding:0 6px;border-radius:3px;white-space:nowrap}
/* 分段开关 */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:2px 9px;font-size:11.5px}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:#fff}
/* 变体 F：三栏（左信息栏 + 日程 + 检查器）。
   左栏只承担一件事：快速知晓并操作「会影响本日日程判断」的状态。 */
.fleft{width:252px;flex:none;overflow:auto;background:var(--panel2);border-right:1px solid var(--line);padding:10px 10px 46px}
.fleft.collapsed{width:32px;padding:10px 4px;overflow:hidden}
.fleft .blk{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:8px}
.fleft .blk > h5{margin:0 0 6px;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.fstate{padding:4px 0;border-bottom:1px dashed var(--line)}
.fstate:last-child{border-bottom:0}
.fstate.unknown{background:var(--warnbg);border-radius:5px;margin:2px 0;padding:4px 5px}
.fstate .ftop{display:flex;gap:6px;align-items:center;justify-content:space-between}
.fstate .ftop > span{font-size:12px}
.fstate .fnote{color:var(--muted);font-size:10.5px;line-height:1.35;margin-top:2px}
.fleft .dt{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-bottom:3px}
.fleft .dt b{font-size:12.5px}
.fleft .dt .k{color:var(--muted);font-size:10.5px;flex:1}
/* 弹层 */
#overlay{position:fixed;inset:0;background:rgba(40,38,32,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
#overlay.on{display:flex}
#modal{background:var(--panel);border-radius:10px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
/* 切换条 */
#switcher{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#22201c;color:#fff;border-radius:999px;padding:5px 6px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:70;font-size:12px}
#switcher button{background:#3a3730;border-color:#4c483e;color:#fff;border-radius:999px;padding:3px 10px}
#switcher button:hover{background:#4c483e}
#switcher .lab{padding:0 8px;min-width:230px;text-align:center;letter-spacing:.02em}
#switcher .n{color:#b9b2a2;font-size:11px}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
table.grid th{color:var(--muted);font-weight:500;font-size:11px}
.rulelist{list-style:none;padding:0;margin:0}
.rulelist li{border-bottom:1px dashed var(--line);padding:4px 0;font-size:11.8px}
.rulelist li .r{color:var(--muted);font-size:10.5px}
.rulelist li.na{opacity:.45;text-decoration:line-through}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
.split{display:flex;gap:10px;align-items:flex-start}
.warnbox{background:var(--warnbg);border:1px solid #e6d69b;border-radius:6px;padding:6px 8px;font-size:11.8px;color:var(--warn);margin:6px 0}
.okbox{background:var(--okbg);border:1px solid #bcdcc4;border-radius:6px;padding:6px 8px;font-size:11.8px;color:var(--ok);margin:6px 0}
.badbox{background:var(--badbg);border:1px solid #e8c3bb;border-radius:6px;padding:6px 8px;font-size:11.8px;color:var(--bad);margin:6px 0}
.infobox{background:var(--infobg);border:1px solid #c3d0e6;border-radius:6px;padding:6px 8px;font-size:11.8px;color:var(--info);margin:6px 0}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="main"></div>
<div id="overlay"><div id="modal"></div></div>
<div id="switcher"></div>
<script>
/* =====================================================================================
   0 · 领域常量与真实数据（来自 docs/research/ 中已核验的 PC 原版 1.6.15 材料）
   ===================================================================================== */

const DAY_END   = 26 * 60;     // 次日 02:00
const STEP      = 10;          // 10 游戏分钟粒度
const PX_PER_MIN = 0.6;        // 时间轴：10 分钟 = 6px

// 作物矩阵：documents/research/stardew-crops-1.6.15.md 的 V1 默认矩阵（40 条）
// [名称, 可种植季节, 首次生长天数, 重复收获间隔(0=一次收获)]

// 九类内置活动 + 自定义。#3 结论：仅浇水按工作量估算，其余按时间预留。
const TYPES = {
  plant:    { name: '种植',        icon: '🌱', timeInput: 'reserve',  rec: 30,  blurb: '可随活动建立计划作物批次；完成后按实际完成日期激活' },

  shop:     { name: '购物',        icon: '🛒', timeInput: 'reserve',  rec: 60,  blurb: '首批门店：皮埃尔杂货店、木匠商店、铁匠铺' },
  toolGive: { name: '工具升级交付', icon: '🔨', timeInput: 'reserve',  rec: 30,  blurb: '完成后工具进入「升级中」，D+2 完成' },
  toolTake: { name: '工具取回',    icon: '📦', timeInput: 'reserve',  rec: 30,  blurb: '完成后才更新工具等级' },
  travel:   { name: '赶路',        icon: '🚶', timeInput: 'reserve',  rec: 30,  blurb: '可选起终点，不估算路线' },
  fishing:  { name: '钓鱼',        icon: '🎣', timeInput: 'reserve',  rec: 120, blurb: '可选地点与自由文本目标，不估算产出' },
  mining:   { name: '采矿',        icon: '⛏️', timeInput: 'reserve',  rec: 120, blurb: '可选地点与自由文本目标，不估算产出' },
  custom:   { name: '自定义活动',  icon: '✏️', timeInput: 'reserve',  rec: 30,  blurb: '玩家自由填写的事项' },
};
const TYPE_ORDER = ['plant', 'water', 'harvest', 'shop', 'toolGive', 'toolTake', 'travel', 'fishing', 'mining', 'custom'];

// 浇水估算：占位校准系数，显式标注为待 #11「执行浇水耗时实测与校准」替换。
const WATER_CALIB = {
  version: '占位系数 v0',
  perTileMin: 0.5,                                  // 每格浇水动作

  maxTiles: 120,                                    // 校准上界，超出即降级
};

// 玩家状态定义（渐进收集 + 状态生效日期）
const STATE_DEFS = {
  wateringCan:     { label: '喷壶等级', values: ['basic', 'copper', 'steel', 'gold', 'iridium'],
                     names: { basic: '基础', copper: '铜', steel: '钢', gold: '金', iridium: '铱' }, def: 'basic',
                     usedBy: '浇水（按工作量估算）' },
  communityCenter: { label: '社区中心状态', values: ['unknown', 'restored', 'notRestored'],

  robinBuilding:   { label: '罗宾正在农场施工', values: ['unknown', 'yes', 'no'],
                     names: { unknown: '未知', yes: '是', no: '否' }, def: 'unknown', usedBy: '木匠商店' },
  resortUnlocked:  { label: '姜岛度假村已解锁', values: ['unknown', 'yes', 'no'],
                     names: { unknown: '未知', yes: '是', no: '否' }, def: 'unknown', usedBy: '木匠商店周二随机分支' },
  backpackFree:    { label: '背包至少一个空位', values: ['unknown', 'yes', 'no'],
                     names: { unknown: '未知', yes: '有', no: '没有' }, def: 'unknown', usedBy: '工具取回' },
};

const TOOLS  = { axe: '斧头', pickaxe: '十字镐', hoe: '锄头', can: '喷壶', pan: '淘盘', trash: '垃圾桶' };
const LEVELS = ['basic', 'copper', 'steel', 'gold', 'iridium'];
const LEVEL_NAMES = { basic: '基础', copper: '铜', steel: '钢', gold: '金', iridium: '铱' };
// 铁匠铺升级矩阵：docs/research/stardew-tool-upgrades.md
const UPGRADE = {
  copper:   { from: 'basic',  mat: '铜锭 ×5', fee: 2000 },
  steel:    { from: 'copper', mat: '铁锭 ×5', fee: 5000 },
  gold:     { from: 'steel',  mat: '金锭 ×5', fee: 10000 },
  iridium:  { from: 'gold',   mat: '铱锭 ×5', fee: 25000 },
};
const SHOPS = {
  pierre: { name: '皮埃尔杂货店', base: { s: 540, e: 1020 }, hours: '09:00–17:00' },
  robin:  { name: '木匠商店',     base: { s: 540, e: 1020 }, hours: '09:00–17:00' },
  clint:  { name: '铁匠铺',       base: { s: 540, e: 960  }, hours: '09:00–16:00' },
};

/* =====================================================================================
   1 · 工具函数
   ===================================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const snap = v => Math.round(v / STEP) * STEP;
const sum = a => a.reduce((x, y) => x + y, 0);

function dkey(d) { return d.year + '-' + d.season + '-' + d.day; }
function dstr(d) { return '第' + d.year + '年 ' + SEASON_NAMES[d.season] + d.day + '日'; }
function dshort(d) { return SEASON_NAMES[d.season] + d.day; }
function weekdayOf(d) { return (d.day - 1) % 7; }              // 0=周一（春 1 日 = 周一）
function addDays(d, n) {
  let { year, season, day } = d; day += n;
  while (day > 28) { day -= 28; season++; if (season > 3) { season = 0; year++; } }
  while (day < 1)  { day += 28; season--; if (season < 0) { season = 3; year--; } }
  return { year, season, day };
}
function cmpDate(a, b) { return (a.year - b.year) || (a.season - b.season) || (a.day - b.day); }
function sameDate(a, b) { return cmpDate(a, b) === 0; }
function tmin(hhmm) { const p = String(hhmm).split(':').map(Number); let v = p[0] * 60 + p[1]; if (v < 6 * 60) v += 1440; return v; }
function fmtT(v) {
  const nd = v >= 1440; const w = ((v % 1440) + 1440) % 1440;
  return (nd ? '次日 ' : '') + pad(Math.floor(w / 60)) + ':' + pad(w % 60);
}
function fmtDur(m) { const h = Math.floor(m / 60), mm = m % 60; return h ? (mm ? h + 'h' + mm + 'm' : h + 'h') : mm + 'm'; }
function mmssFromRange(s, e) { return fmtT(s) + '–' + fmtT(e); }

/* =====================================================================================
   2 · 状态与持久化
   ===================================================================================== */
function freshState() {
  const defs = {}; for (const k in STATE_DEFS) defs[k] = { value: STATE_DEFS[k].def, effectiveFrom: null };
  const table = {}; for (const t of TYPE_ORDER) table[t] = TYPES[t].rec;
  return {
    v: 2,
    mode: 'single',
    currentGameDay: { year: 1, season: 0, day: 1 },
    viewingDay: { year: 1, season: 0, day: 1 },
    weather: 'sunny',                       // sunny | rain | greenRain | unknown
    specialDay: 'none',                     // none | festival
    playerState: defs,
    toolLevels: { axe: 'basic', pickaxe: 'basic', hoe: 'basic', can: 'basic', pan: 'copper', trash: 'basic' },
    goals: [],
    activities: [],
    defaultTable: table,                    // 系统推荐预留（推荐预留默认值表）
    personalDefaults: {},                   // 玩家明确保存的个人默认
    lastReserved: {},                       // 最近一次预留 { minutes, date }
    anchorLog: [],                          // 锚定对照观察记录
    scenario: 'fresh',
    gapMode: 'real',
  };
}
let state = freshState();
let ui = { variant: 'F', sel: null, panel: null, tab: 'state', seed: {}, pending: null, showDetail: {}, leftCollapsed: false };

function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { console.warn('保存失败', e); } }
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || s.v !== 2) return false;      // v2：批次与升级流程改为派生，不再存于状态
    state = Object.assign(freshState(), s);
    return true;
  } catch (e) { console.warn('恢复失败', e); return false; }
}
function wipe() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

const getAct = id => state.activities.find(a => a.id === id);
const sortedActs = () => state.activities.slice().sort((a, b) => tmin(a.start) - tmin(b.start) || String(a.id).localeCompare(String(b.id)));

/* =====================================================================================
   3 · 领域计算：时长来源优先级 / 浇水估算 / 冲突 / 空闲 / 门店 / 工具升级 / 批次
   ===================================================================================== */

// 优先级：当前活动手填值 > 玩家明确保存的个人默认 > 最近一次预留 > 系统推荐预留
function priorityDuration(type) {
  if (state.personalDefaults[type] != null) return { minutes: state.personalDefaults[type], source: 'personal' };
  if (state.lastReserved[type]) return { minutes: state.lastReserved[type].minutes, source: 'last', date: state.lastReserved[type].date };
  return { minutes: state.defaultTable[type], source: 'system' };
}
const SOURCE_LABEL = {
  manual: '手填（当前活动）', estimate: '系统估算', personal: '个人默认',
  last: '最近一次预留', system: '系统推荐预留', seed: '对照初始值（原型）',
};
const SOURCE_CLASS = { manual: 'manual', estimate: 'estimate', personal: 'personal', last: 'last', system: 'system', seed: 'proto' };

// 浇水工作量估算（占位系数）
function estimateWater(act, canOverride) {
  const w = act.workload || {};
  const tiles = Number(w.tiles || 0);
  const density = w.density || 'normal';
  const can = canOverride || state.playerState.wateringCan.value;
  const reasons = [];
  if (state.mode !== 'single') reasons.push('当前为多人模式，未包含在已校准场景内');
  if (!tiles || tiles < 1) return { ok: false, reasons: ['未填写待浇水格数'] };
  if (tiles > WATER_CALIB.maxTiles) reasons.push('格数 ' + tiles + ' 超出校准上界 ' + WATER_CALIB.maxTiles + ' 格');
  if (reasons.length) return { ok: false, reasons };
  const df = WATER_CALIB.density[density].f;
  const cap = WATER_CALIB.canCapacity[can] || 40;
  const refills = Math.floor((tiles - 1) / cap);
  const actionMin = tiles * WATER_CALIB.perTileMin * df;
  const refillMin = refills * WATER_CALIB.refillMin;
  const minutes = snap(Math.max(STEP, actionMin + refillMin));
  return {
    ok: true, minutes,
    breakdown: [
      { k: '浇水动作', v: tiles + ' 格 × ' + WATER_CALIB.perTileMin + ' 分/格 × ' + WATER_CALIB.density[density].label + '系数 ' + df + ' = ' + actionMin.toFixed(1) + ' 分' },
      { k: '田间往返补水', v: refills + ' 次 × ' + WATER_CALIB.refillMin + ' 分 = ' + refillMin.toFixed(1) + ' 分' },
      { k: '喷壶容量', v: LEVEL_NAMES[can] + '级 ' + cap + ' 格' },
    ],
  };
}

// 活动的实际时长与来源标签
function actTime(act) {
  if (act.manualDuration != null) return { minutes: act.manualDuration, source: 'manual' };
  if (act.seedOverride != null) return { minutes: act.seedOverride, source: 'seed' };
  if (TYPES[act.type].timeInput === 'workload') {
    const e = estimateWater(act);
    if (e.ok) return { minutes: e.minutes, source: 'estimate', breakdown: e.breakdown };
  }
  return priorityDuration(act.type);
}
function actRange(act) { const s = tmin(act.start), t = actTime(act); return { s, e: s + t.minutes, t }; }

// 冲突组：直接重叠 + 传递闭包
function conflictGroups() {
  const items = sortedActs().map(a => { const r = actRange(a); return { a, s: r.s, e: r.e }; });
  const groups = []; let cur = null;
  for (const it of items) {
    if (cur && it.s < cur.end) { cur.items.push(it); cur.end = Math.max(cur.end, it.e); }
    else { cur = { items: [it], s: it.s, end: it.e }; groups.push(cur); }
  }
  return groups;
}
function layoutInfo() {
  const groups = conflictGroups(), layout = {}, conflicts = [];
  for (const g of groups) {
    const lanes = [];
    for (const it of g.items) {
      let li = lanes.findIndex(end => end <= it.s);
      if (li < 0) { lanes.push(it.e); li = lanes.length - 1; } else lanes[li] = it.e;
      layout[it.a.id] = { lane: li, lanes: 1, conflict: g.items.length > 1 };
    }
    for (const it of g.items) layout[it.a.id].lanes = lanes.length;
    if (g.items.length > 1) conflicts.push(g);
  }
  return { groups, layout, conflicts };
}
function directOverlaps(id) {
  const a = actRange(getAct(id));
  return state.activities.filter(b => b.id !== id).filter(b => { const r = actRange(b); return a.s < r.e && r.s < a.e; });
}
function freeGaps() {
  const gaps = []; let cursor = DAY_START;
  for (const a of sortedActs()) {
    const r = actRange(a);
    if (r.s > cursor) gaps.push({ s: cursor, e: r.s });
    cursor = Math.max(cursor, r.e);
  }
  if (cursor < DAY_END) gaps.push({ s: cursor, e: DAY_END });
  return gaps.filter(g => g.e - g.s >= STEP);
}
function overrun() {
  // 超出游戏日：结束时刻晚于次日 02:00，保留原安排，只提示超出量
  return sortedActs().map(a => ({ a, r: actRange(a) })).filter(x => x.r.e > DAY_END)
    .map(x => ({ a: x.a, over: x.r.e - DAY_END }));
}

// 工具升级流程：从「已完成的交付 / 取回活动」派生，不物化存储。
// 物化会让「取消完成」留下错误状态（工具仍是铜级、仍标已取回）；派生则天然回到原状态。
function currentUpgrade() {
  const gives = state.activities
    .filter(a => a.type === 'toolGive' && a.done && a.doneDate && a.tool && a.to)
    .sort((x, y) => cmpDate(parseDkey(x.doneDate), parseDkey(y.doneDate)));
  const last = gives[gives.length - 1];
  if (!last) return null;
  const taken = state.activities.some(a => a.type === 'toolTake' && a.done && a.doneDate &&
    a.tool === last.tool && cmpDate(parseDkey(a.doneDate), parseDkey(last.doneDate)) >= 0);
  return { tool: last.tool, to: last.to, from: UPGRADE[last.to].from, delivered: last.doneDate, taken };
}
// 工具等级 = 玩家声明的等级 与 已完成取回所达到的等级 取高者（工具只会升级，不会降级）
function effectiveLevel(tool) {
  let best = state.toolLevels[tool] || (tool === 'pan' ? 'copper' : 'basic');
  for (const a of state.activities) {
    if (a.type === 'toolTake' && a.done && a.tool === tool && a.to &&
        LEVELS.indexOf(a.to) > LEVELS.indexOf(best)) best = a.to;
  }
  return best;
}

// 工具升级状态机
function upgradeInfo(date) {
  const u = currentUpgrade();
  if (!u) return null;
  const done = addDays(parseDkey(u.delivered), 2);   // u.delivered 是日期键字符串，必须先解析
  const isDone = cmpDate(date, done) >= 0;
  const status = u.taken ? '已取回' : isDone ? '待取回' : '升级中';
  const clint = shopStatus('clint', date);
  const earliest = clint.service.level === 'ok' ? date : null;   // 能办理才算可取回
  return { u, done, status, clint, earliest, mat: UPGRADE[u.to].mat, fee: u.tool === 'trash' ? UPGRADE[u.to].fee / 2 : UPGRADE[u.to].fee };
}
function upgradePreview(tool, to) {
  const from = UPGRADE[to].from;
  const fee = tool === 'trash' ? UPGRADE[to].fee / 2 : UPGRADE[to].fee;
  return { from, to, mat: UPGRADE[to].mat, fee };
}

// 作物批次：从「已完成的种植活动」派生，不物化存储。
// 物化会让「取消完成」留下孤儿批次；派生则天然回到原状态。
// 批次身份 = 种植活动本身，所以收获活动的关联引用在重新完成后会自动重新生效。
function batches() {
  return state.activities.filter(a => a.type === 'plant' && a.done && a.doneDate).map(a => {
    const crop = CROPS.find(c => c[0] === a.crop) || CROPS[0];
    const plantDate = parseDkey(a.doneDate);
    const verified = (a.env || 'open') === 'open' && (a.fert || 'none') === 'none' &&
                     crop[1].includes(SEASON_NAMES[plantDate.season]);
    return {
      id: a.id, activityId: a.id, fromActivity: a.id,
      crop: crop[0], planted: a.doneDate,
      tiles: Number(a.tiles || 0) || null,
      env: a.env || 'open', fert: a.fert || 'none',
      growth: crop[2], regrow: crop[3], verified,
      firstHarvest: dkey(addDays(plantDate, crop[2])),
    };
  });
}
function parseDkey(k) { const p = String(k).split('-').map(Number); return { year: p[0], season: p[1], day: p[2] }; }

// 重估预览：在临时改写状态下比较每个活动「改前 / 改后」的结论
function withState(key, value, fn) {
  const prev = state.playerState[key];
  state.playerState[key] = { value, effectiveFrom: prev.effectiveFrom };
  try { return fn(); } finally { state.playerState[key] = prev; }
}
// 活动结论 = 系统估算时长（浇水）或规则判断结论（门店卡片）；受保护记录与已完成记录返回 null
function conclude(a) {
  if (a.done) return null;
  if (TYPES[a.type].timeInput === 'workload') {
    if (a.manualDuration != null) return null;              // 手填时长受保护，重估不覆盖
    const e = estimateWater(a);
    if (e.ok) return { kind: 'time', minutes: e.minutes, text: '系统估算 ' + fmtDur(e.minutes) };
    const p = priorityDuration(a.type);
    return { kind: 'time', minutes: p.minutes, text: '降级为按时间预留 ' + fmtDur(p.minutes) + '（' + e.reasons.join('；') + '）' };
  }
  if (a.type === 'shop') { const st = shopStatus(a.shop, state.viewingDay); return { kind: 'text', text: SHOPS[a.shop].name + '：可进 ' + st.access.headline + '／可交易 ' + st.service.headline }; }
  if (a.type === 'toolTake') {
    const u = upgradeInfo(state.viewingDay);
    return { kind: 'text', text: u ? '柜台：' + u.clint.headline : '（当前无升级流程）' };
  }
  if (a.type === 'plant' || a.type === 'harvest') return null;
  return null;
}
function previewStateChange(key, value, effectiveFrom) {
  const out = [];
  for (const a of state.activities) {
    const ad = a.date ? parseDkey(a.date) : state.viewingDay;
    if (effectiveFrom && cmpDate(ad, effectiveFrom) < 0) continue;   // 生效日期之前的活动不受影响
    const before = conclude(a);
    if (!before) continue;
    const after = withState(key, value, () => conclude(a));
    if (!after || after.text === before.text) continue;
    out.push({ a, from: before, to: after });
  }
  return out;
}

/* =====================================================================================
   4 · 变更操作
   ===================================================================================== */
function newActivity(type, start) {
  const s = start != null ? start : nextFreeStart();
  const seedV = ui.seed[type];
  const a = {
    id: uid(), type, date: dkey(state.viewingDay), start: fmtT(s), done: false,
    goals: [], note: '', repeat: null,
    manualDuration: null,                                    // 手填值：一旦写入即优先于整条预留链
    seedOverride: seedV != null ? seedV : null,              // 锚定对照用的强制初始值
    workload: type === 'water' ? { tiles: 20, density: 'normal' } : null,
  };
  if (type === 'plant') { a.crop = CROPS.find(c => c[1].includes(SEASON_NAMES[state.viewingDay.season]))[0]; a.env = 'open'; a.fert = 'none'; a.tiles = 0; }
  if (type === 'shop') { a.shop = 'pierre'; a.items = []; }
  if (type === 'toolGive') { a.tool = 'axe'; a.to = nextLevel(effectiveLevel('axe')); }
  if (type === 'toolTake') { const u = currentUpgrade(); a.tool = u ? u.tool : 'axe'; a.to = u ? u.to : 'copper'; }
  if (type === 'travel' || type === 'fishing' || type === 'mining') { a.place = ''; a.target = ''; if (type === 'travel') { a.from = ''; a.toPlace = ''; } }
  if (type === 'custom') a.name = '自定义活动';
  state.activities.push(a);
  ui.sel = a.id;
  return a;
}
function nextLevel(lv) { const i = LEVELS.indexOf(lv); return LEVELS[Math.min(i + 1, 4)]; }
function nextFreeStart() {
  const g = freeGaps().find(x => x.e - x.s >= 30);
  return g ? g.s : DAY_START;
}
function moveStart(id, s) {
  const a = getAct(id); if (!a) return;
  a.start = fmtT(clamp(snap(s), DAY_START, DAY_END - STEP));
}
function setDuration(id, m) {
  const a = getAct(id); if (!a) return;
  const v = Math.max(STEP, snap(m));                 // 10 游戏分钟粒度
  if (a.seedOverride != null && a.seedOverride !== v) {
    state.anchorLog.push({ type: a.type, seed: a.seedOverride, final: v, at: dkey(state.viewingDay) });
    a.seedOverride = null;                            // 对照初始值只影响新建时的起点
  }
  // 手填会同时写「最近一次预留」。「最近一次预留」是玩家偏好的记忆，无法从活动派生
  // （删掉那个活动后这份记忆仍应保留），所以这是全模型唯一需要显式记账反操作的地方。
  if (a.manualDuration == null) a.prevLastReserved = state.lastReserved[a.type] || null;
  a.manualDuration = v;
  state.lastReserved[a.type] = { minutes: v, date: dkey(state.viewingDay) };
  save();
}
function restoreDuration(id) {
  const a = getAct(id); if (!a) return;
  if (a.manualDuration != null && 'prevLastReserved' in a) {
    if (a.prevLastReserved) state.lastReserved[a.type] = a.prevLastReserved;
    else delete state.lastReserved[a.type];
  }
  delete a.prevLastReserved;
  a.manualDuration = null; a.seedOverride = null; save();
}
// 交换两项的开始时刻（↑↓ 与「拖到另一张卡」共用同一语义）
function swapStarts(a, b) {
  const x = getAct(a), y = getAct(b);
  if (!x || !y) return;
  const s = x.start; x.start = y.start; y.start = s;
  save();
}
// 完成 / 取消完成：只改活动自身。
// 批次、工具升级流程、工具等级全部从「已完成的活动」派生，所以取消完成会自然回到原状态，
// 不需要任何反操作书。计划日期不改变任何状态——只有完成才改变。
function completeAct(id, on) {
  const a = getAct(id); if (!a) return;
  a.done = !!on;
  if (on) a.doneDate = dkey(state.viewingDay); else delete a.doneDate;
  save();
}

/* =====================================================================================
   9b · 变体 D · 融合：把时间轴与列表合为一个面
   纵向位置 = 开始时刻，空隙 = 空闲，缩进 = 被包在另一项之内。
   代价：时长不再由面积表达（改用卡内比例条），全天不再保证一屏。
   ===================================================================================== */
const GAP_MODES = {
  compact: { px: 30, label: '紧凑',
             note: '空隙一律压到 30px：页面最紧凑，但空隙之间的大小比较会丢失——每个空隙的准确时长仍写在它上面。' },
  real:    { px: null, label: '真实比例',
             note: '空隙按真实时长留白，不封顶：形状可信，代价是页面变高。全天留白总量最多约 720px，也就是游戏日本身的长度。' },
};                  // 只留两个语义明确的档位：一个为读清单，一个为读形状
const GAP_MIN_PX = 18;    // 空隙留白下限：保证“空闲 10m”这类标签读得出来
const INDENT_PX = 20;     // 包含关系缩进

// 包含关系：为每个活动找到最紧的容器（时长更短且把它整个包住的活动）
function fusedPlan() {
  const acts = sortedActs();
  const parent = {};
  for (const a of acts) {
    const r = actRange(a);
    let best = null, bestLen = Infinity;
    for (const b of acts) {
      if (b.id === a.id) continue;
      const rb = actRange(b), blen = rb.e - rb.s;
      if (!(rb.s <= r.s && rb.e >= r.e && blen > r.e - r.s)) continue;
      if (blen < bestLen) { best = b; bestLen = blen; }
    }
    if (best) parent[a.id] = best.id;
  }
  const children = {};
  for (const id in parent) (children[parent[id]] = children[parent[id]] || []).push(id);
  // 顶层项按开始时刻排序；同一时刻先排时长更长的，容器才会先于被包含项出现
  const top = acts.filter(a => !parent[a.id])
    .sort((x, y) => tmin(x.start) - tmin(y.start) || actTime(y).minutes - actTime(x).minutes);
  return { top, children, parent };
}

function containsAct(outer, inner) {
  const ro = actRange(outer), ri = actRange(inner);
  return ro.s <= ri.s && ro.e >= ri.e && (ro.e - ro.s) > (ri.e - ri.s);
}

// 冲突标签里用的短名：区分具体门店/作物，但不把「赶路：农场 → 镇上」这种长串塞进标签
function shortTitle(a) {
  if (a.type === 'shop') return SHOPS[a.shop] ? SHOPS[a.shop].name : '购物';
  if (a.type === 'custom') return a.name || '自定义活动';
  if (a.type === 'plant') return '种植' + (a.crop ? ' ' + a.crop : '');
  if (a.type === 'toolGive' || a.type === 'toolTake') return TYPES[a.type].name;
  return TYPES[a.type].name;
}
function fusedCard(a, depth, layout, plan) {
  const r = actRange(a), t = r.t;
  const ov = directOverlaps(a.id);
  const partial = ov.some(o => !containsAct(o, a) && !containsAct(a, o));
  const kids = plan.children[a.id] || [];
  const myParent = plan.parent[a.id];
  let h = '<div class="fcard' + (ui.sel === a.id ? ' sel' : '') + (a.done ? ' done' : '') + (partial ? ' spine' : '') +
    (depth > 0 ? ' nested' : '') + '" data-select="' + a.id + '" data-drop="card" data-dropid="' + a.id + '">';
  h += '<div class="ftitle">' + (depth > 0 ? '<span class="meta">' + fmtT(r.s) + '</span> ' : '') +
    TYPES[a.type].icon + ' ' + esc(actTitle(a)) + ' <span class="meta">' + fmtDur(t.minutes) + '</span></div>';
  h += '<div class="row wrap"><span class="tag ' + SOURCE_CLASS[t.source] + '">' + SOURCE_LABEL[t.source] + '</span>';
  if (partial) h += '<span class="tag conflict">同时进行 · 与 ' + ov.map(shortTitle).join('、') + '</span>';
  else if (kids.length) h += '<span class="tag conflict">包含 ' + kids.map(k => shortTitle(getAct(k))).join('、') + '</span>';
  else if (myParent) h += '<span class="tag conflict">在 ' + shortTitle(getAct(myParent)) + ' 期间</span>';
  if (r.e > DAY_END) h += '<span class="tag conflict">超出游戏日 ' + fmtDur(r.e - DAY_END) + '</span>';
  if ((a.goals || []).length) h += '<span class="tag goal">目标 ×' + a.goals.length + '</span>';
  if (a.repeat) h += '<span class="tag">重复 ' + a.repeat + ' 天</span>';
  if (a.done) h += '<span class="tag ok">已完成</span>';
  if (a.note) h += '<span class="tag">' + esc(a.note) + '</span>';
  return h + '</div></div>';
}

function fusedRows(a, depth, layout, plan) {
  const r = actRange(a);
  const move = depth === 0
    ? '<div class="fmove"><button class="ghost" data-act="up" data-id="' + a.id + '" title="与上一项交换开始时刻">↑</button>' +
      '<button class="ghost" data-act="down" data-id="' + a.id + '" title="与下一项交换开始时刻">↓</button></div>'
    : '';
  // 嵌套行不再重复父行的刻度，避免相邻两行同一时刻的错觉；子项的起刻移入卡片内
  const gutter = depth === 0 ? fmtT(r.s) : '<span title="这一项被上一项覆盖，起刻见卡片内">↳</span>';
  let h = '<div class="frow"><span class="fgutter' + (depth > 0 ? ' cont' : '') + '">' + gutter + '</span>' +
    '<div class="fcardwrap" style="padding-left:' + (depth * INDENT_PX) + 'px">' +
    '<div style="position:relative">' + fusedCard(a, depth, layout, plan) + move + '</div></div></div>';
  const kids = (plan.children[a.id] || []).map(getAct).sort((x, y) => tmin(x.start) - tmin(y.start));
  for (const k of kids) h += fusedRows(k, depth + 1, layout, plan);
  return h;
}

// 空隙：高度 = min(封顶, 真实分钟 × 刻度)，低于下限则抬起；数字总是准确值
function gapRow(startMin, minutes) {
  const raw = minutes * PX_PER_MIN;
  const cap = (GAP_MODES[state.gapMode] || GAP_MODES.real).px;   // 档位只剩 compact / real
  const cut = cap == null ? Infinity : cap;
  const px = Math.round(clamp(raw, GAP_MIN_PX, cut));
  const adjusted = Math.round(raw) !== px;
  return '<div class="fgap' + (adjusted ? ' adj' : '') + '" data-drop="gap" data-drops="' + startMin + '"' +
    (adjusted ? ' title="真实时长 ' + fmtDur(minutes) + '：为节省高度未按比例显示"' : '') +
    ' style="height:' + px + 'px"><span>空闲 ' + fmtDur(minutes) + '</span></div>';
}
// 部分重叠：不留白，改成“同时进行”标记
function ovRow(minutes, a) {
  return '<div class="fov" style="height:' + GAP_MIN_PX + 'px"><span>与上一项同时进行 · 重叠 ' + fmtDur(minutes) + '</span></div>';
}

// 日程列表本体（D 与 F 共用）：空隙、卡片、冲突与超出提示
function fusedListHtml(plan, layout, conflicts, over) {
  const top = plan.top;
  let h = '';
  if (!top.length) h += '<div class="empty">这一天还没有活动。点「＋ 添加」开始。</div>';
  let cursor = DAY_START;
  for (const a of top) {
    const r = actRange(a);
    if (r.s > cursor) h += gapRow(cursor, r.s - cursor);
    else if (r.s < cursor) h += ovRow(cursor - r.s, a);
    h += fusedRows(a, 0, layout, plan);
    cursor = Math.max(cursor, r.e);
  }
  if (cursor < DAY_END) h += gapRow(cursor, DAY_END - cursor);
  if (conflicts.length) h += '<div class="badbox" style="margin-top:10px">冲突组 ' + conflicts.length + ' 个：' + conflicts.map(g => g.items.map(i => TYPES[i.a.type].name).join(' ⊕ ')).join('；') + '</div>';
  if (over.length) h += '<div class="warnbox">超出游戏日：' + over.map(o => TYPES[o.a.type].name + ' ' + fmtDur(o.over)).join('、') + '（保留原安排，不截短）</div>';
  return h;
}

// 某个玩家状态是否被本日的某个活动实际使用——左栏只列真有依赖的状态
function stateUsedBy(key, a) {
  switch (key) {
    case 'wateringCan':     return a.type === 'water';
    case 'communityCenter': return (a.type === 'shop' && (a.shop === 'pierre' || a.shop === 'clint')) || a.type === 'toolGive' || a.type === 'toolTake';
    case 'keyToTown':       return a.type === 'shop' || a.type === 'toolGive' || a.type === 'toolTake';
    case 'robinBuilding':   return a.type === 'shop' && a.shop === 'robin';
    case 'resortUnlocked':  return (a.type === 'shop' && a.shop === 'robin') || a.type === 'toolTake';
    case 'backpackFree':    return a.type === 'toolTake';
    default: return false;
  }
}
const statesUsedToday = () => Object.keys(STATE_DEFS).filter(k => state.activities.some(a => stateUsedBy(k, a)));

// 该状态此刻造成的后果，一句话，面向玩家
function stateEffect(key) {
  const acts = state.activities.filter(a => stateUsedBy(key, a));
  const n = acts.length;
  switch (key) {
    case 'wateringCan': {
      const down = acts.filter(a => !estimateWater(a).ok);
      return down.length ? n + ' 项浇水已降级为按时间预留' : n + ' 项浇水按工作量估算';
    }
    case 'communityCenter': {
      const shops = acts.filter(a => a.type === 'shop');
      if (!shops.length) return n + ' 项交付／取回受它影响';
      return shops.map(a => SHOPS[a.shop].name + '：' + shopStatus(a.shop, state.viewingDay).service.headline).join('；');
    }
    case 'robinBuilding':
      return '木匠商店：' + shopStatus('robin', state.viewingDay).service.headline;
    case 'resortUnlocked':
      return n ? n + ' 项的随机分支（可能离店，无法静态确定）' : '本日不涉及';
    case 'keyToTown':
      return n + ' 项的进门条件（不改变服务判断）';
    case 'backpackFree': {
      const up = currentUpgrade();
      return up ? '取回 ' + TOOLS[up.tool] + ' 前需清出一个空位' : '本日没有取回活动';
    }
    default: return n + ' 项活动';
  }
}

  h += notes.length ? notes.map(x => '<div class="fnote">· ' + esc(x) + '</div>').join('')
                    : '<div class="fnote">没有待处理项。</div>';

/* =====================================================================================
   10 · 渲染与事件
   ===================================================================================== */
function actTitle(a) {
  if (a.type === 'custom') return a.name || '自定义活动';
  if (a.type === 'shop') return SHOPS[a.shop] ? SHOPS[a.shop].name : TYPES[a.type].name;
  if (a.type === 'plant') return '种植 ' + (a.crop || '');
  if (a.type === 'harvest') return '收获' + (a.batchId ? '（批次）' : '');
  if (a.type === 'toolGive' || a.type === 'toolTake') return TYPES[a.type].name + ' ' + TOOLS[a.tool] + '→' + LEVEL_NAMES[a.to];
  if (a.type === 'travel') return '赶路' + (a.from || a.toPlace ? '：' + (a.from || '?') + ' → ' + (a.toPlace || '?') : '');
  if (a.type === 'fishing' || a.type === 'mining') return TYPES[a.type].name + (a.place ? '：' + a.place : '');
  return TYPES[a.type].name;
}

// 变体注册表：新增变体只需在这里加一行
const VARIANTS = [
  { k: 'D', name: '融合 · 按时间定位的单列表', render: renderD },
  // ownsGlobals：该变体自己就展示了「今天的前提」，顶部栏因此让位、不重复

];
const curVariant = () => VARIANTS.find(v => v.k === ui.variant) || VARIANTS[0];
const curOwnsGlobals = () => !!curVariant().ownsGlobals;
function cycleVariant(step) {
  const i = ((VARIANTS.findIndex(v => v.k === ui.variant) + step) % VARIANTS.length + VARIANTS.length) % VARIANTS.length;
  ui.variant = VARIANTS[i].k;
}
function render() {

  const main = $('#main');
  const scrolls = Array.from(main.querySelectorAll('.col')).map(c => c.scrollTop);

// 事件委托
document.addEventListener('click', e => {
  // 分段开关（空隙留白档位）
  const gmb = e.target.closest('button[data-gapmode]');
  if (gmb) { state.gapMode = gmb.dataset.gapmode; save(); render(); return; }
  const sel = e.target.closest('[data-select]');
  if (sel) { ui.sel = sel.dataset.select; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  if (act !== 'panel') { /* 保持面板状态 */ }
  switch (act) {
    case 'variant': {
      cycleVariant(Number(el.dataset.v));
      break;
    }
    case 'panel': ui.panel = el.dataset.p || null; if (!ui.panel) ui.pending = null; break;
    case 'shiftview': state.viewingDay = addDays(state.viewingDay, Number(el.dataset.d)); save(); break;
    case 'shiftcur': state.currentGameDay = addDays(state.currentGameDay, Number(el.dataset.d)); save(); break;
    case 'quickadd': ui.panel = 'add'; break;
    case 'lefttoggle': ui.leftCollapsed = !ui.leftCollapsed; break;
    case 'new': {
      const a = newActivity(el.dataset.t, ui.slotStart == null ? undefined : ui.slotStart);
      ui.slotStart = null;
      ui.panel = null;
      break;
    }
    case 'slotadd': { ui.panel = 'add'; ui.slotStart = Number(el.dataset.s); break; }
    case 'dur': { const a = getAct(id); if (a) setDuration(id, actTime(a).minutes + Number(el.dataset.d)); break; }
    case 'restore': restoreDuration(id); break;
    case 'savepersonal': { const a = getAct(id); if (a) { state.personalDefaults[a.type] = actTime(a).minutes; save(); } break; }
    case 'clearpersonal': { const a = getAct(id); if (a) { delete state.personalDefaults[a.type]; save(); } break; }
    case 'del': { state.activities = state.activities.filter(x => x.id !== id); if (ui.sel === id) ui.sel = null; save(); break; }
    case 'dup': {
      const a = getAct(id), c = JSON.parse(JSON.stringify(a));
      c.id = uid(); c.done = false; delete c.doneDate; c.start = fmtT(Math.min(DAY_END - STEP, tmin(a.start) + actTime(a).minutes));
      state.activities.push(c); ui.sel = c.id; save(); break;
    }
    case 'up': case 'down': {
      const acts = sortedActs(), i = acts.findIndex(x => x.id === id), j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= acts.length) break;
      swapStarts(acts[i].id, acts[j].id);
      break;
    }
    case 'additem': { const a = getAct(id); a.items = a.items || []; a.items.push({ name: '', qty: 1 }); save(); break; }
    case 'delitem': { const a = getAct(id); a.items.splice(Number(el.dataset.i), 1); save(); break; }
    case 'addgoal': { const v = ($('#newGoal') || {}).value; if (v && v.trim()) { state.goals.push({ id: uid(), title: v.trim(), steps: [] }); save(); } break; }
    case 'delgoal': state.goals = state.goals.filter(g => g.id !== id); save(); break;
    case 'addstep': {
      const g = state.goals.find(x => x.id === id), inp = document.querySelector('[data-stepinput="' + id + '"]');
      if (g && inp && inp.value.trim()) { g.steps = g.steps || []; g.steps.push({ id: uid(), title: inp.value.trim(), done: false }); save(); }
      break;
    }
    case 'delstep': { const g = state.goals.find(x => x.id === el.dataset.gid); if (g) g.steps = g.steps.filter(s => s.id !== el.dataset.sid); save(); break; }
    case 'step': break; // 由 change 处理
    case 'anchornew': {
      const t = ($('#anchorType') || {}).value || 'harvest', m = Number(($('#anchorMult') || {}).value || 1);
      ui.seed[t] = Math.max(STEP, snap(state.defaultTable[t] * m));
      const a = newActivity(t, ui.slotStart);
      ui.slotStart = null; ui.seed = Object.assign({}, ui.seed);
      break;
    }
    case 'anchorclear': ui.seed = {}; break;
    case 'exportdefaults': {
      const txt = JSON.stringify(state.defaultTable, null, 2);
      try { navigator.clipboard.writeText(txt); alert('已复制推荐预留默认值表：\n\n' + txt); }
      catch (err) { alert(txt); }
      break;
    }
    case 'pendingok': {
      const p = ui.pending;
      state.playerState[p.key] = { value: p.value, effectiveFrom: p.effectiveFrom };
      ui.pending = null; save(); break;
    }
    case 'pendingno': ui.pending = null; break;
    case 'wipe': wipe(); state = freshState(); ui.sel = null; ui.panel = null; break;
    case 'redump': save(); break;
    case 'seed': seedScenario(el.dataset.s); break;
    default: break;
  }
  render();
});

// 下拉 / 文本 / 勾选
document.addEventListener('change', e => {
  const stepEl = e.target.closest('[data-act="step"]');
  if (stepEl) {
    const g = state.goals.find(x => x.id === stepEl.dataset.gid);
    const s = g && (g.steps || []).find(x => x.id === stepEl.dataset.sid);
    if (s) { s.done = stepEl.checked; save(); render(); }
    return;
  }
  const st = e.target.closest('[data-state]');
  if (st) {
    const k = st.dataset.state;
    if (st.dataset.stateval) {
      // 任何状态修改都先进入重估预览，确认前不改变日程
      const value = st.value;
      const effEl = st.parentElement.querySelector('[data-stateeff]');
      const eff = effEl ? parseLooseDate(effEl.value) : (st.dataset.plain ? state.currentGameDay : null);
      ui.pending = { key: k, value, effectiveFrom: eff, affected: previewStateChange(k, value, eff), label: STATE_DEFS[k].label + ' → ' + STATE_DEFS[k].names[value] };
      save(); return render();
    }
    if (st.dataset.stateeff) {
      state.playerState[k] = Object.assign({}, state.playerState[k], { effectiveFrom: parseLooseDate(st.value) });
      save(); return render();
    }
  }
  const gm = e.target.closest('[data-gapmode]');
  if (gm && gm.tagName === 'SELECT') { state.gapMode = gm.value; save(); return render(); }
  const df = e.target.closest('[data-default]');
  if (df) { state.defaultTable[df.dataset.default] = Math.max(10, Number(df.value) || 10); save(); return render(); }
  const gl = e.target.closest('[data-global]');
  if (gl) { state[gl.dataset.global] = gl.value; save(); return render(); }
  const f = e.target.closest('[data-field]');
  if (f) {
    const a = getAct(f.dataset.id); if (!a) return;
    applyField(a, f);
    save(); return render();
  }
});

function applyField(a, el) {
  const field = el.dataset.field;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.num) v = Number(v) || 0;
  switch (field) {
    case 'done': completeAct(a.id, v); break;
    case 'start': a.start = v; break;
    case 'note': a.note = v; break;
    case 'repeat': a.repeat = v || null; break;
    case 'goal': {
      a.goals = a.goals || [];
      const gid = el.dataset.gid;
      if (v) { if (!a.goals.includes(gid)) a.goals.push(gid); } else a.goals = a.goals.filter(x => x !== gid);
      break;
    }
    case 'tiles': {
      if (a.type === 'water') { a.workload = a.workload || {}; a.workload.tiles = v; }
      else a.tiles = v;
      break;
    }
    case 'density': a.workload = a.workload || {}; a.workload.density = v; break;
    case 'itemName': (a.items[Number(el.dataset.i)] || {}).name = v; break;
    case 'itemQty': (a.items[Number(el.dataset.i)] || {}).qty = v; break;
    default: a[field] = v; break;
  }
}
function updateLiveSpans() {
  document.querySelectorAll('[data-est]').forEach(el => {
    const a = getAct(el.dataset.est); if (!a) return;
    if (a.type === 'shop') el.innerHTML = shopCardHtml(a.shop || 'pierre', shopStatus(a.shop || 'pierre', state.viewingDay), true);
    else if (a.type === 'water') el.innerHTML = estimateHtml(a);
    else if (a.type === 'toolGive') el.innerHTML = upgradeRefHtml(a);
  });
}
document.addEventListener('input', e => {
  if (e.target.closest('[data-live]') && e.target.closest('[data-field]')) updateLiveSpans();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    cycleVariant(e.key === 'ArrowRight' ? 1 : -1);
    render();
  }
  if (e.key === 'Escape') { ui.panel = null; ui.pending = null; render(); }
});

// 变体 D 的拖动：压缩轴不做连续拖动，改用「离散落点」：
//   落到空隙   → 移到该空闲时段起点
//   落到卡片上半 → 紧贴到它前面（新起点 = 目标起点 − 自身时长）
//   落到卡片下半 → 紧贴到它后面（新起点 = 目标结束时刻）
// 互换相邻两项用 ↑↓（精确、无歧义），不占用拖动手势。
let dDrag = null, dHot = null;
const HOT_CLASSES = ['drop-on', 'drop-before', 'drop-after'];
function dropAt(x, y) {
  const el = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
  if (!el || !el.closest) return null;
  const t = el.closest('[data-drop]');
  if (!t) return null;
  if (t.dataset.drop === 'gap') return { el: t, kind: 'gap', s: Number(t.dataset.drops), cls: 'drop-on' };
  const box = t.getBoundingClientRect();
  const upper = (y - box.top) < box.height / 2;
  return { el: t, kind: upper ? 'before' : 'after', id: t.dataset.dropid, cls: upper ? 'drop-before' : 'drop-after' };
}
function clearHot() {
  if (dHot && dHot.classList) HOT_CLASSES.forEach(c => dHot.classList.remove(c));
  dHot = null;
}
// 落点 → 新的开始时刻（纯函数，便于验证）
function dropStartFor(t, src, tgt) {
  if (!t) return null;
  if (t.kind === 'gap') return t.s;
  if (!tgt || !src) return null;
  if (t.kind === 'before') return tmin(tgt.start) - actTime(src).minutes;
  if (t.kind === 'after') return tmin(tgt.start) + actTime(tgt).minutes;
  return null;
}
// 拖动是否在该元素上生效：按「能力」判断——该元素是否属于融合列表的卡片。
// 不要按变体名判断：D 与 F 共用同一套融合列表，新增变体也应自动获得拖动。
function dragTargetAt(el) {
  if (!el || !el.closest) return null;
  if (el.closest('button') || el.closest('input')) return null;
  return el.closest('.fcard[data-dropid]');
}
document.addEventListener('pointerdown', e => {
  const card = dragTargetAt(e.target);
  if (!card) return;
  dDrag = { id: card.dataset.dropid, x: e.clientX, y: e.clientY, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!dDrag) return;
  if (!dDrag.moved && Math.hypot(e.clientX - dDrag.x, e.clientY - dDrag.y) > 6) {
    dDrag.moved = true; document.body.classList.add('dragging');
  }
  if (!dDrag.moved) return;
  const t = dropAt(e.clientX, e.clientY);
  if (!t) { clearHot(); return; }
  if (t.el !== dHot) { clearHot(); dHot = t.el; dHot.classList.add(t.cls); }
});
document.addEventListener('pointerup', e => {
  if (!dDrag) return;
  const wasDrag = dDrag.moved, id = dDrag.id;
  dDrag = null; document.body.classList.remove('dragging'); clearHot();
  if (!wasDrag) return;                       // 单击交给 click 处理选中
  const t = dropAt(e.clientX, e.clientY);
  if (!t || t.id === id) return;
  const src = getAct(id), tgt = t.id ? getAct(t.id) : null;
  const ns = dropStartFor(t, src, tgt);
  if (ns == null) return;
  moveStart(id, ns);
  save(); render();
});

/* =====================================================================================
   11 · 场景种子
   ===================================================================================== */
function seedScenario(s) {
  if (s === 'fresh') { wipe(); state = freshState(); state.scenario = '首次使用（无保存数据）'; ui.sel = null; ui.pending = null; save(); return; }
  if (s === 'empty') {
    state = freshState(); state.scenario = 'empty';
    state.playerState.wateringCan = { value: 'copper', effectiveFrom: { year: 1, season: 0, day: 1 } };
    state.goals = [{ id: uid(), title: '攒钱买下 12 格洒水器', steps: [{ id: uid(), title: '挖 60 铜矿', done: false }, { id: uid(), title: '凑够 12,000g', done: false }] }];
    ui.sel = null; return;
  }
  if (s === 'restored') { load(); state.scenario = '已保存数据'; ui.sel = null; return; }
  if (s === 'conflict') {
    state = freshState(); state.scenario = '冲突场景';
    state.viewingDay = { year: 1, season: 0, day: 3 };
    state.currentGameDay = { year: 1, season: 0, day: 3 };
    state.playerState.wateringCan = { value: 'copper', effectiveFrom: { year: 1, season: 0, day: 1 } };
    state.goals = [{ id: uid(), title: '春季凑齐 30 个防风草', steps: [{ id: uid(), title: '完成第一次收获', done: false }] }];
    const g1 = state.goals[0].id;
    const mk = (o) => { const a = Object.assign({ id: uid(), date: dkey(state.viewingDay), done: false, goals: [], note: '', manualDuration: null, seedOverride: null, repeat: null }, o); state.activities.push(a); return a; };
    const w = mk({ type: 'water', start: '06:00', workload: { tiles: 40, density: 'normal' } });
    const t = mk({ type: 'travel', start: '06:00', from: '农场', toPlace: '镇上' });
    state.lastReserved.water = { minutes: 25, date: dkey(state.viewingDay) };
    const s1 = mk({ type: 'shop', start: '09:00', shop: 'robin', items: [{ name: '木材', qty: 100 }], goals: [g1] });
    s1.manualDuration = 90;
    const h1 = mk({ type: 'harvest', start: '09:30', manualDuration: 45, done: true, doneDate: dkey(state.viewingDay) });
    const pl = mk({ type: 'plant', start: '14:00', crop: 'Parsnip', env: 'open', fert: 'none', tiles: 40, goals: [g1] });
    const c1 = mk({ type: 'custom', start: '16:30', name: '修围栏', manualDuration: 120 });
    mk({ type: 'fishing', start: '01:30', place: '山湖', target: '钓 5 条鲈鱼' });
    ui.sel = w.id; save(); return;
  }
}

/* =====================================================================================
   12 · 启动
   ===================================================================================== */
(function boot() {
  const restored = load();
  state.scenario = restored ? '已保存数据（刷新恢复）' : '首次使用（无保存数据）';
  if (!state.activities.length && !state.goals.length && !restored) {
    // 首次使用：只要求当前游戏日与模式，不预先索取长档案
    state.currentGameDay = { year: 1, season: 0, day: 1 };
    state.viewingDay = { year: 1, season: 0, day: 1 };
  }
  render();
  // 调试钩子：便于在控制台核对模型，不是产品接口。
  window.PROTOTYPE = {
    get state() { return state; }, get ui() { return ui; }, fresh: () => { wipe(); state = freshState(); render(); },
    model: { addDays, weekdayOf, dkey, dstr, tmin, fmtT, fmtDur, cmpDate, estimateWater, actTime, actRange, conflictGroups,
             layoutInfo, freeGaps, overrun, shopStatus, upgradeInfo, upgradePreview, priorityDuration, parseDkey,
             newActivity, completeAct, moveStart, setDuration, restoreDuration, swapStarts, seedScenario, render, previewStateChange,
             fusedPlan, containsAct, VARIANTS, dropStartFor, dragTargetAt,
             batches, currentUpgrade, effectiveLevel },
  };
})();
</script>
